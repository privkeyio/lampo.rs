[workspace]
members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-testing",
        "tests/tests",
        "lampo-chain",
        "lampo-bdk-wallet"
]

default-members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-chain",
        "lampo-bdk-wallet"
]
resolver = "2"

# LDK 0.3 is published to crates.io as a pre-release, so the requirement has to
# spell out `0.3.0-beta1`: a bare `0.3` does not match pre-release versions.
# Bump every lightning* crate together so the stack stays on one version
# (see issue #537).
[workspace.dependencies]
# All lightning* crates come from one git revision: privkeyio/rust-lightning's
# blake2b branch, which follows BLAKE2b proof of work. Mixing this lightning crate with the crates.io
# rc2 crates builds two copies of lightning-types and the traits no longer match.
lightning = { git = "https://github.com/privkeyio/rust-lightning", rev = "f71c3b763" }
lightning-block-sync = { git = "https://github.com/privkeyio/rust-lightning", rev = "f71c3b763" }
lightning-persister = { git = "https://github.com/privkeyio/rust-lightning", rev = "f71c3b763", features = ["tokio"] }
lightning-background-processor = { git = "https://github.com/privkeyio/rust-lightning", rev = "f71c3b763" }
lightning-net-tokio = { git = "https://github.com/privkeyio/rust-lightning", rev = "f71c3b763" }
lightning-rapid-gossip-sync = { git = "https://github.com/privkeyio/rust-lightning", rev = "f71c3b763" }

[patch.crates-io]
bitcoin = { git = "https://github.com/privkeyio/rust-bitcoin", rev = "3c8cd5749b998069cb641fa150944760945329ff" }
